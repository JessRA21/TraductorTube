<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traductor de Transcripciones | AI Powered</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <!-- Librería para exportar a Excel (.xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Librería para exportar a PowerPoint (.pptx) -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="assets/css/style.css">

<body>

  <!-- Barra Superior Transparente (Header / Navbar) -->
  <header class="app-header py-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        
        <!-- Izquierda: Logo -->
        <a href="#" class="navbar-brand d-flex align-items-center text-white text-decoration-none">
          <img src="assets/img/logo.png" alt="Logo" class="app-logo me-2" onerror="this.style.display='none'">
          <span class="fw-bold fs-5 tracking-wide">TraductorTube</span>
        </a>

        <!-- Derecha: Menú de Exportación/Descarga -->
        <div class="dropdown">
          <button class="btn btn-export-dropdown dropdown-toggle" type="button" id="exportMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-download me-2"></i>Exportar transcripción
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-lg border-0 mt-2" aria-labelledby="exportMenuBtn">
            <li>
              <button class="dropdown-item d-flex align-items-center py-2" id="btnExportPDF">
                <i class="bi bi-file-earmark-pdf text-danger me-2 fs-5"></i> Descargar en PDF (.pdf)
              </button>
            </li>
            <li>
              <button class="dropdown-item d-flex align-items-center py-2" id="btnExportExcel">
                <i class="bi bi-file-earmark-excel text-success me-2 fs-5"></i> Descargar en Excel (.xlsx)
              </button>
            </li>
            <li>
              <button class="dropdown-item d-flex align-items-center py-2" id="btnExportPPT">
                <i class="bi bi-file-earmark-slides text-warning me-2 fs-5"></i> Descargar en PowerPoint (.pptx)
              </button>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <button class="dropdown-item d-flex align-items-center py-2" id="btnExportTXT">
                <i class="bi bi-file-earmark-text text-primary me-2 fs-5"></i> Texto plano (.txt)
              </button>
            </li>
          </ul>
        </div>

      </div>
    </div>
  </header>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        
        <!-- Encabezado de la app -->
        <div class="text-center mb-5">
          <h1 class="header-title display-5 mb-2">
            <i class="bi bi-translate me-2"></i>Traductor de Transcripciones
          </h1>
          <p class="header-subtitle">Obtén la transcripción traducida de cualquier video al instante mediante IA</p>
        </div>

                <label for="videoUrl" class="form-label fw-semibold">
                  <i class="bi bi-link-45deg me-1"></i>URL del Video
                </label>
                <input type="url" class="form-control" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." required>
              </div>

              <!-- Vista previa de video -->
              <div class="mb-4 ratio ratio-16x9 video-preview-wrapper d-none" id="videoPreviewContainer">
                <iframe id="videoIframe" src="" title="Video preview" allowfullscreen></iframe>
              </div>

              <div class="row g-3 mb-4">
                <div class="col-md-6">
                  <label for="sourceLang" class="form-label fw-semibold">

                    <option value="yo">Yoruba</option>
                    <option value="zul">Zulú</option>
                  </select>
                </div>
              </div>

              <!-- Botón de envío -->
              <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary btn-lg fw-bold" id="translateBtn">
                  <i class="bi bi-magic me-2"></i>Obtener y traducir transcripción
                </button>
              </div>
            </form>

            <!-- Contenedor de Resultado estructurado limpiamente -->
            <div id="translationResult" class="mt-4 d-none">
              <hr class="my-4 text-muted opacity-25">
              
              <!-- Cabecera de la sección de respuesta (Título a la izq, Botón Copiar a la der) -->
              <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-semibold text-secondary fs-6">
                  <i class="bi bi-translate me-2"></i>Transcripción Traducida:
                </span>
                <button id="btnCopy" type="button" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                  <i class="bi bi-clipboard me-1"></i>Copiar
                </button>
              </div>

              <!-- Caja de Texto del Resultado -->
              <div id="translationText" class="form-control p-3" style="min-height: 200px; max-height: 400px; overflow-y: auto; white-space: pre-wrap; background-color: #f8f9fa; border-radius: 8px;"></div>
            </div>

          </div>
        </div>

      </div>
    </div>

  <!-- Footer Elegante Compacto -->

    <div class="container">
      <div class="row text-center small text-white-50 pt-1">
